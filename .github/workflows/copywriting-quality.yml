name: Copywriting code quality

on:
  push:
    paths:
      - "scripts/test_copywriting_*.py"
      - "tests/unit/test_copywriting_logic.py"
      - "pyproject.toml"
      - ".flake8"
      - "requirements-copywriting-dev.txt"
      - ".github/workflows/copywriting-quality.yml"
  pull_request:
    paths:
      - "scripts/test_copywriting_*.py"
      - "tests/unit/test_copywriting_logic.py"
      - "pyproject.toml"
      - ".flake8"
      - "requirements-copywriting-dev.txt"
      - ".github/workflows/copywriting-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-copywriting-dev.txt
      - run: python -m pip install -r requirements-copywriting-dev.txt
      - name: Format
        run: >-
          python -m black --check --workers 1
          scripts/test_copywriting_batch.py scripts/test_copywriting_logic.py
          tests/unit/test_copywriting_logic.py
      - name: Import order
        run: >-
          python -m isort --check-only
          scripts/test_copywriting_batch.py scripts/test_copywriting_logic.py
          tests/unit/test_copywriting_logic.py
      - name: Style
        run: >-
          python -m flake8 scripts/test_copywriting_batch.py
          scripts/test_copywriting_logic.py tests/unit/test_copywriting_logic.py
      - name: Types
        run: python -m mypy
      - name: Error diagnostics
        run: >-
          python -m pylint scripts/test_copywriting_batch.py
          scripts/test_copywriting_logic.py tests/unit/test_copywriting_logic.py
      - name: Unit tests without model weights
        run: python scripts/test_copywriting_logic.py
