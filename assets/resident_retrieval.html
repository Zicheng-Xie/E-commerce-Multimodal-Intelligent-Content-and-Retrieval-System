<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模块二 · 多模态商品检索</title><style>body{font:16px system-ui;margin:0;background:#f4f7fb;color:#192f49}main{max-width:1320px;margin:auto;padding:28px}h1{margin-bottom:6px}.panel{background:white;border:1px solid #d9e2ef;border-radius:14px;padding:22px;margin:20px 0}label{display:inline-block;margin:8px 14px 8px 0}input,select,button{font:inherit;padding:10px;border:1px solid #b6c7db;border-radius:8px}input[type=text]{width:min(650px,85%)}input[type=number]{width:80px}button{cursor:pointer;background:#244f86;color:white;border:0;padding:12px 28px}button:disabled{opacity:.5}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}article{background:white;padding:18px;border:1px solid #d9e2ef;border-radius:12px}article img{width:100%;height:190px;object-fit:contain}article h3{font-size:16px;line-height:1.6}small{color:#60718b}#status{white-space:pre-wrap}#queryPreview{max-width:220px;max-height:160px}details{font-size:14px;color:#60718b}p{line-height:1.7}.tag{background:#e3edf9;padding:4px 10px;border-radius:12px;font-size:13px}</style><main><span class="tag">模块二开发演示</span><h1>多模态商品检索</h1><small>原标题、商品图、ROI区域注意力与主体语义共同参与检索。排序分用于比较候选；业务质量尚未完成独立验收。</small><section class="panel"><label>查询方式 <select id="mode"><option value="text">文本搜商品</option><option value="image">图片搜商品</option></select></label><label>检索策略 <select id="method"></select></label><div id="textControls"><label for="text">商品需求</label><input id="text" type="text" value="无线蓝牙耳机" placeholder="输入中文商品需求"></div><div id="imageControls" hidden><label>查询图片 <select id="imageId"></select></label><input id="imagePath" type="text" hidden placeholder="项目内图片的绝对或相对路径"><div><img id="queryPreview" alt="查询商品" hidden></div><label><input id="useRoi" type="checkbox">裁切并放大指定区域</label><span id="roiInputs"><input type="number" id="x1" min="0" max="1" step="0.05" value="0.1" aria-label="左边界"><input type="number" id="y1" min="0" max="1" step="0.05" value="0.1" aria-label="上边界"><input type="number" id="x2" min="0" max="1" step="0.05" value="0.9" aria-label="右边界"><input type="number" id="y2" min="0" max="1" step="0.05" value="0.9" aria-label="下边界"></span></div><p><button id="search" disabled>检索商品</button></p><div id="status">正在连接本地常驻服务…</div></section><section id="cards"></section></main><script>
const $=id=>document.getElementById(id);let samples=null;const names={constraint_aware_fusion:'商品主体与属性约束',semantic_profile_blend:'固定语义融合',balanced_logistic:'弱标签逻辑回归',hard_negative_ranknet:'困难负例排序',refined_logistic:'像素复核后逻辑回归',refined_ranknet:'像素复核后困难负例排序'};
function toggle(){const image=$('mode').value==='image';$('imageControls').hidden=!image;$('textControls').hidden=image;const q=samples?.image_queries.find(x=>x.id===$('imageId').value);$('imagePath').hidden=$('imageId').value!=='custom';$('queryPreview').hidden=!image||!q;if(q)$('queryPreview').src=q.image_url;}
$('mode').onchange=toggle;$('imageId').onchange=toggle;
$('search').onclick=async()=>{ $('search').disabled=true;$('status').textContent='正在检索…';try{const query={method:$('method').value,top_k:10};if($('mode').value==='text')query.text=$('text').value;else{if($('imageId').value==='custom')query.image_path=$('imagePath').value;else query.image_id=$('imageId').value;if($('useRoi').checked)query.roi=['x1','y1','x2','y2'].map(k=>Number($(k).value));}const start=performance.now(),response=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(query)}),data=await response.json();if(!response.ok)throw Error(data.error);$('status').textContent=`返回${data.results.length}件商品 · 页面请求${((performance.now()-start)/1000).toFixed(2)}秒 · 服务处理${data.processing_seconds.toFixed(2)}秒`;$('cards').replaceChildren();for(const r of data.results){const card=document.createElement('article'),a=document.createElement('a'),img=document.createElement('img');a.href=r.image_url;a.target='_blank';img.src=r.image_url;img.alt=r.title;a.append(img);card.append(a);const title=document.createElement('h3');title.textContent=`${r.rank}. ${r.title}`;card.append(title);const info=document.createElement('p');info.textContent=`${r.category} · 排序分 ${r.score.toFixed(4)}`;card.append(info);const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='查看局部匹配与依据';details.append(summary);const crop=document.createElement('img');crop.src=r.focus_image_url;crop.alt='主要匹配局部';details.append(crop);const text=document.createElement('p');text.textContent=`整图 ${r.components.global_image.toFixed(3)} · 区域 ${r.components.regional_attention.toFixed(3)} · 标题 ${r.components.published_title.toFixed(3)} · 主体语义 ${r.components.semantic_profile.toFixed(3)}`;details.append(text);if(r.constraint_evidence){const why=document.createElement('p');why.textContent='约束依据：'+JSON.stringify(r.constraint_evidence);details.append(why);}card.append(details);$('cards').append(card);}}catch(e){$('status').textContent='检索未完成：'+e.message;}finally{$('search').disabled=false;}};
(async()=>{try{const response=await fetch('/api/samples');samples=await response.json();for(const method of samples.methods){const option=document.createElement('option');option.value=method;option.textContent=names[method]||method;$('method').append(option);}for(const image of samples.image_queries){const option=document.createElement('option');option.value=image.id;option.textContent=image.id;$('imageId').append(option);}const option=document.createElement('option');option.value='custom';option.textContent='使用项目内其他图片';$('imageId').append(option);$('search').disabled=false;$('status').textContent='本地模型和286件开发商品索引已就绪。';toggle();}catch(e){$('status').textContent='服务连接失败：'+e.message;}})();
</script></html>
